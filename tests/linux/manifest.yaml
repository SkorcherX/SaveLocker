# Fixture manifest for the Linux harness. Mirrors the shape of the real Ludusavi manifest:
# a Windows game whose save path is a <winAppData> token — which, under Proton, must resolve
# INSIDE the game's Wine prefix rather than against the host.
#
# The portable game is here ONLY to pin the install-root guard. Its manifest entry saves as a loose
# file beside the executable — the Cave Story+ shape — so it resolves to the install DIRECTORY, i.e.
# the whole game. That answer must be dropped, leaving the real portable save folder (<base>/Saves)
# to win. Without the guard the install directory resolves first and beats it.
Fake Prefix Game:
  files:
    <winAppData>/FakePrefixGame:
      tags:
        - save
Fake Portable Game:
  files:
    <base>/Save.dat:
      tags:
        - save

# An installed Steam game. Its prefix lives in the library it is INSTALLED in, not in the main
# Steam root, so this only resolves if discovery walks libraryfolders.vdf and pairs each library
# with its own compatdata.
#
# It also carries NO cloud block, which is the manifest's way of saying "no Steam Cloud" — the
# generator writes only ticked stores and omits the block when none are. Being sold on Steam must
# therefore not flag it, or the default Add Games view hides a game nothing else backs up.
Fake Installed Game:
  files:
    <winAppData>/FakeInstalledGame:
      tags:
        - save

# The other half of that pair: sold on Steam AND actually covered by Steam Cloud. Without this the
# suite cannot tell a manifest read from a constant — flipping the flag to always-false would pass
# every check above.
Fake Cloud Game:
  cloud:
    steam: true
  files:
    <winAppData>/FakeCloudGame:
      tags:
        - save

# Sold on Steam, cloud block present, but GOG-only — the Breath of Fire IV shape, and the case that
# motivated reading the field. A block that exists is not a block that names Steam.
Fake Gog Cloud Game:
  cloud:
    gog: true
  files:
    <winAppData>/FakeGogCloudGame:
      tags:
        - save

# The two Heroic games. Same tokens, resolved inside prefixes Steam did not create: one
# proton-shaped (pfx/, user steamuser), one wine-shaped (drive_c/ directly, Linux username).
Heroic Prefix Game:
  files:
    <winAppData>/HeroicPrefixGame:
      tags:
        - save
Heroic Wine Game:
  files:
    <winDocuments>/HeroicWineGame:
      tags:
        - save

# Present in the manifest ON PURPOSE. The renamed-prefix case is only a real test if the stranded
# save WOULD resolve: a resolver that fell back to the prefix holding the game's files would find
# this and hand back a path nothing writes to any more.
Heroic Offline Game:
  files:
    <winDocuments>/HeroicOfflineGame:
      tags:
        - save

# A MoonDeck-streamed game, ALSO installed locally under Proton. Its shortcut's own AppID never
# gets a compatdata prefix (Steam launches MoonDeck's client script, not the game); this only
# resolves if discovery reads MOONDECK_STEAM_APP_ID out of LaunchOptions and tries THAT prefix too.
MoonDeck Streamed Game:
  files:
    <winAppData>/MoonDeckStreamedGame:
      tags:
        - save

# Installed in a second library, but its compatdata prefix is left behind in the MAIN Steam root —
# the shape of a game moved to an SD card after Steam already created its prefix elsewhere. Only
# resolves if discovery falls back to the main root when the current library's own prefix is missing.
Fake Relocated Game:
  files:
    <winAppData>/FakeRelocatedGame:
      tags:
        - save

# Installed, but has no compatdata prefix anywhere — its only save path is Steam's own Cloud sync
# folder under the Steam root's userdata, which needs no Wine prefix to resolve at all. Only
# resolves if discovery does not gate resolution on a prefix existing first.
Fake Cloud Only Game:
  files:
    <root>/userdata/<storeUserId>/440904/remote:
      tags:
        - save

# Genuinely installed with real Steam Cloud AND has a MoonDeck shortcut pointing at it — the
# Cyberpunk 2077 shape. The installed copy must win the dedupe despite having Steam Cloud, because a
# MoonDeck shortcut is a pointer, not an independent build; unlike the DRM-free-shortcut case, Cloud
# coverage here says nothing about which candidate is more useful to track.
Fake Dual Source Game:
  cloud:
    steam: true
  files:
    <winAppData>/FakeDualSourceGame:
      tags:
        - save

# Installed on a library that is not mounted at all — no ACF reachable anywhere, only Steam's own
# "apps" bookkeeping (which survives the library being absent) and a MoonDeck shortcut naming the
# same real AppID. Real Steam Cloud, to prove HasSteamCloud switches from the shortcut default
# (always false) to the manifest's real answer once the install is confirmed this way.
Fake Phantom Installed Game:
  cloud:
    steam: true
  files:
    <winAppData>/FakePhantomInstalledGame:
      tags:
        - save
