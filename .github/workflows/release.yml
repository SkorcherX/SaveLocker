name: Build and release agent installer

on:
  push:
    tags: ['v*']

# Actions are pinned to full commit SHAs, not tags. A tag is a moving pointer the action's owner can
# repoint at any time, and these actions handle the release artifacts that agents download and then
# EXECUTE — the update channel's integrity starts here. The trailing comment records which release
# each SHA was, so a future bump is a readable diff rather than an opaque hex swap.
jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create the GitHub Release

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0   # MinVer needs full history to walk back to the nearest tag
          fetch-tags: true # explicitly fetch all tags — checkout doesn't guarantee this on tag-triggered runs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent-ui/package-lock.json

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\installer\build-installer.ps1 -AppVersion $version

      # A checksum the user can verify by hand, for the copy they downloaded from the Releases page.
      # The server computes its own digest over the bytes it stored, so the agent's update channel
      # does not depend on this file — it is for the human doing a manual install.
      - name: Checksum the installer
        shell: bash
        run: |
          cd installer/dist
          sha256sum SaveLocker-Agent-Setup-*.exe > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt

      # The release body is the SAME file the console bundles and renders under What's New
      # (web/src/releases/<ver>.md), so notes are written once and cannot drift between the two.
      # Falls back to GitHub's generated commit list if the file is missing, rather than releasing
      # with no notes at all.
      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          path="web/src/releases/${GITHUB_REF_NAME#v}.md"
          if [ -f "$path" ]; then
            echo "path=$path" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No hand-written notes at $path — falling back to generated notes."
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release and upload installer
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            installer/dist/SaveLocker-Agent-Setup-*.exe
            installer/dist/SHA256SUMS-windows.txt
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}

  # ── Linux agent (Steam Deck / SteamOS) ────────────────────────────────────────────────────
  # Without this job there is no way for a Deck user to install the agent at all: SteamOS ships no
  # .NET runtime and its rootfs is immutable, so "clone the repo and build it" is not an option.
  #
  # This MUST run on ubuntu-latest, and not only for convenience. A self-contained .NET binary binds
  # to the HOST's glibc at build time, and an older-glibc build runs on newer systems but never the
  # reverse. Ubuntu 24.04 (glibc 2.39) is older than SteamOS's rolling Arch, so Ubuntu -> Deck is
  # forward-compatible. Building this on a newer host would produce "GLIBC_2.4x not found" on the
  # user's Deck — an error that cannot be reproduced on the machine that built it.
  # (Decisions.md §6.)
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # attestations are signed with a short-lived OIDC token
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent-ui/package-lock.json

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '10.0.x'

      # The version is passed explicitly: MinVer stamps 0.0.0.0 when it cannot reach the git history
      # on a runner, and the agent reports its version to the console in every heartbeat — an
      # unstamped build shows up in the dashboard as a lie.
      #
      # It is also what the agent's own updater checks the tarball against: a staged package must
      # report the version the server offered before it is allowed to replace a working agent. An
      # unstamped tarball fails that check, so this is now load-bearing rather than cosmetic.
      - name: Build self-contained tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash packaging/linux/build-linux.sh "$version"

      - name: Checksum the tarball
        run: |
          cd artifacts/linux
          sha256sum savelocker-*-linux-x64.tar.gz > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      # Ties this exact tarball to this exact workflow run, verifiable with
      # `gh attestation verify <file> --repo Marwanello/SaveLocker`. Unlike the checksum, this does
      # not depend on trusting the page the checksum was read from.
      - name: Attest the tarball
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: artifacts/linux/savelocker-*-linux-x64.tar.gz

      # No generate_release_notes here: this job only ATTACHES assets to the release the installer
      # job created, and asking for generated notes a second time would overwrite the hand-written
      # body that job already set.
      - name: Attach tarball to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            artifacts/linux/savelocker-*-linux-x64.tar.gz
            artifacts/linux/SHA256SUMS-linux.txt
